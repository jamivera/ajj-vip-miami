name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repo de proyecto → el sitio se sirve bajo /<repo>/ en Pages.
      PAGES_BASE: /ajj-vip-miami/
      # La raíz de este despliegue muestra directamente la propuesta (enlace corto).
      VITE_HOME_IS_PROPOSAL: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build (production)
        run: npm run build

      - name: SPA fallback (404 = index)
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Disable Jekyll processing
        run: touch apps/web/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
